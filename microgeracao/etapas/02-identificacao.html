
<div class="card">
  <div class="section-eyebrow">Etapa 2</div>
  <h3 class="card-title">Dados para contato</h3>
  <h4 class="card-subtitle">Dados do proprietário</h4>
  <p class="card-sub">
    Preencha os dados do titular da conta de energia ou do proprietário do
    imóvel.
  </p>
  <div class="grid grid-2">
    <div class="field">
      <label>Nome Completo ou Razão Social <span class="req">*</span></label>
      <input
        type="text"
        data-k="titular"
        placeholder="Nome completo ou razão social"
      />
    </div>
    <div class="field">
      <label>E-mail do cliente <span class="req">*</span></label>
      <input
        type="email"
        data-k="email"
        placeholder="email@exemplo.com"
        onblur="onEmailGD('email')"
      />
      <span id="status-email" class="field-hint"></span>
    </div>
    <div class="field">
      <label>Celular <span class="req">*</span></label>
      <input
        type="tel"
        data-k="celular"
        placeholder="(31) 90000-0000"
        oninput="onMascara(this, mascararCelular)"
        onblur="onTelGD('celular')"
      />
      <span id="status-celular" class="field-hint"></span>
    </div>
    <div class="field">
      <label>CPF / CNPJ <span class="req">*</span></label>
      <input
        type="text"
        id="f_cpfcnpj"
        data-k="cpfCnpj"
        placeholder=" "
        oninput="onCpfCnpjGD(this)"
      />
      <span class="field-hint" id="status-cnpj"></span>
    </div>

    <div class="field pf-campo" style="display: none">
      <label>Filiação (Mãe ou Pai) <span class="req">*</span></label>
      <input
        type="text"
        data-k="filiacao"
        placeholder="Nome da mãe ou do pai"
      />
    </div>
    <div class="field pf-campo" style="display: none">
      <label>RG / RNE / RANI</label>
      <input
        type="text"
        data-k="rg"
        placeholder="00.000.000"
        oninput="onMascara(this, mascararRG)"
      />
    </div>
    <div class="field pf-campo" style="display: none">
      <label>Data de Nascimento <span class="req">*</span></label>
      <input type="date" data-k="nasc" />
    </div>
    <div class="field pf-campo" style="display: none">
      <label>Possui equipamentos essenciais? <span class="req">*</span></label>
      <select data-k="laudoMedico">
        <option value="">—</option>
        <option>Sim</option>
        <option>Não</option>
      </select>
    </div>
    <div class="field pf-campo" style="display: none">
      <label>Possui NIS para Tarifa Social? <span class="req">*</span></label>
      <select data-k="nis" onchange="onNisGD()">
        <option value="">—</option>
        <option>Sim</option>
        <option>Não</option>
      </select>
    </div>
    <div
      class="field pf-campo col-span-2"
      id="numNisBox"
      style="display: none"
    >
      <label>Número do NIS <span class="req">*</span></label>
      <input type="text" data-k="numNis" placeholder="Número do NIS" />
    </div>
  </div>

  <h4 class="card-subtitle divider">Dados do responsável técnico</h4>
  <p class="card-sub">
    Preencha os dados do responsável técnico pelo empreendimento.
  </p>
  <div class="grid grid-2">
    <div class="field">
      <label>Nome <span class="req">*</span></label>
      <input
        type="text"
        data-k="rtNome"
        placeholder="Nome do responsável técnico"
      />
    </div>
    <div class="field">
      <label>E-mail <span class="req">*</span></label>
      <input
        type="email"
        data-k="rtEmail"
        placeholder="email@exemplo.com"
        onblur="onEmailGD('rtEmail')"
      />
      <span id="status-rtEmail" class="field-hint"></span>
    </div>
    <div class="field">
      <label>Celular <span class="req">*</span></label>
      <input
        type="tel"
        data-k="rtCelular"
        placeholder="(31) 90000-0000"
        oninput="onMascara(this, mascararCelular)"
        onblur="onTelGD('rtCelular')"
      />
      <span id="status-rtCelular" class="field-hint"></span>
    </div>
  </div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" onclick="goTo(0)">← Voltar</button>
  <button class="btn btn-primary" data-gate="gdPropDocOk" onclick="goTo(2)">
    Avançar →
  </button>
</div>
