<!--
  ============================================================
  CAMPOS NÃO ALOCADOS — área de espera (oculta na tela)
  ------------------------------------------------------------
  Etapas definitivas do microGD (8): Orientações, Dados do
  proprietário, Dados da unidade, Tipo de atendimento, Cargas
  das UCs, Correspondência, Observações, Prévia & PDF.

  Os campos abaixo pertenciam a etapas que deixaram de existir
  e ainda não têm destino definido. Ficam AQUI, fora da tela,
  para que:
    - o estado (data-k) continue bindado e o PDF não perca dado;
    - os handlers de initFormulario() sigam encontrando os
      elementos que consultam (nada quebra no boot);
    - cada campo seja localizável pela marcação data-alocar,
      que nomeia a etapa de origem.

  Para realocar: mova o bloco .campo-nao-alocado para o
  fragmento da etapa de destino e remova o atributo data-alocar.
  Busca rápida: grep -rn "data-alocar" microgeracao/etapas/
  <!-- ===== origem: Dados técnicos da UC ===== -->
<!-- #seBox (galeria "Tipo de Subestação") saiu daqui: a escolha da subestação
     passou a ser feita pelo bloco técnico da etapa 4 (Tipo de atendimento),
     portado do MT — ver microgeracao/js/subestacao.js. -->
<div class="grid grid-2">
  <div class="field campo-nao-alocado col-span-2" data-alocar="dados-uc">
    <label>Tipo de Solicitação</label>
    <select data-k="solicitacao" onchange="onSolicitacao()"></select>
  </div>
  <div
    class="field campo-nao-alocado col-span-2"
    data-alocar="dados-uc"
    id="avisoFormCarga"
    style="display: none"
  >
    <div class="cmg-aviso no-print">
      <div class="cmg-aviso-icon" aria-hidden="true"></div>
      <p class="cmg-aviso-texto">
        Para este tipo de solicitação é obrigatório declarar todas as cargas
        elétricas da unidade na etapa Dados das unidades.
      </p>
    </div>
  </div>
  <div class="field campo-nao-alocado col-span-2" data-alocar="dados-uc">
    <label>Tipo de edificação</label>
    <select data-k="edificacao"></select>
  </div>
  <div class="field campo-nao-alocado" data-alocar="dados-uc">
    <label>Tipo de Padrão de Entrada</label>
    <select data-k="edifTipo"></select>
  </div>
  <div class="field campo-nao-alocado" data-alocar="dados-uc">
    <label>Tipo de Ramal</label>
    <select data-k="ramal" data-sem-vazio></select>
  </div>
  <!-- disjAtualA e disjGeralA foram para a etapa 5 (Tipo de atendimento),
         onde aparecem conforme o tipo de edificação. Aqui resta a FASE do
         disjuntor geral, que alimenta a lista de correntes (onDisjFase) e o
         limite de injeção — na etapa 5 ela é derivada do tipo de rede. -->
  <div class="field campo-nao-alocado" data-alocar="dados-uc">
    <label>Disjuntor Geral — Fase</label>
    <select data-k="disjGeralFase" onchange="onDisjFase()"></select>
  </div>
  <div class="field campo-nao-alocado" data-alocar="dados-uc">
    <label>Qte Disjuntor Geral</label>
    <input
      type="text"
      data-k="qteDisjGeral"
      placeholder=" "
      oninput="onSoDigitos(this)"
    />
  </div>
  <div
    class="field campo-nao-alocado"
    data-alocar="dados-uc"
    id="instExistenteBTMTBox"
  >
    <label>A instalação existente é atendida em BT ou MT?</label>
    <select
      data-k="instExistenteBTMT"
      onchange="onInstExistenteBTMT()"
    ></select>
  </div>
  <div
    class="field campo-nao-alocado col-span-2"
    data-alocar="dados-uc"
    id="novaProtecaoBox"
    style="display: none"
  >
    <label>Nova Proteção</label>
    <input type="text" data-k="novaProtecao" placeholder=" " />
  </div>
  <!-- As demandas contratadas saíram daqui: viraram pares de potências
       contratadas ("a ser contratada" / "atual" / "futura", conforme a
       solicitação) — a de consumo na etapa 4 (Tipo de atendimento) e a de
       geração na etapa 5 (Dados da geração). Manter as cópias aqui duplicaria
       os ids que essas etapas reescrevem por JS. -->
</div>

<!-- A ilha "Transformadores (Qte × Potência)" saiu daqui: os transformadores
     agora são declarados em cards na etapa 4 (Dados dos transformadores),
     com situação, potência e tipo de ligação — ver
     microgeracao/js/subestacao.js. -->

<!-- ===== origem: Dados da geração (fora do escopo da etapa 4) ===== -->
<div class="grid grid-2 campo-nao-alocado" data-alocar="geracao-outorga">
  <div class="field col-span-2">
    <label>CEG do empreendimento</label>
    <input type="text" data-k="ceg" placeholder=" " />
  </div>
  <div class="field">
    <label>Número do Ato de Outorga ou Registro</label>
    <input type="text" data-k="numAtoOutorga" placeholder=" " />
  </div>
  <div class="field col-span-2">
    <label>Nome da Usina</label>
    <input type="text" data-k="nomeUsina" placeholder=" " />
  </div>
  <div class="field">
    <label>Ano do Ato de Outorga ou Registro</label>
    <input
      type="text"
      data-k="anoAtoOutorga"
      placeholder=" "
      oninput="onSoDigitos(this)"
    />
  </div>
  <div class="field col-span-2">
    <label>Tipo do Ato de Outorga ou Registro</label>
    <input type="text" data-k="tipoAtoOutorga" placeholder=" " />
  </div>
  <!-- armProducaoMensal: campo específico do armazenamento. A "Produção mensal
         (kWh)" da geração deixou de existir no formulário. -->
  <div class="field campo-nao-alocado" data-alocar="armazenamento">
    <label>Produção mensal da central geradora (kWh)</label>
    <input
      type="text"
      data-k="armProducaoMensal"
      placeholder=" "
      oninput="onNumDec(this)"
    />
  </div>
</div>
