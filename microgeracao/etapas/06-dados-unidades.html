<!--
  ============================================================
  ETAPA 6 (fluxo Coletivo/Agrupamento) — Dados das unidades
  ------------------------------------------------------------
  Só existe quando "Tipo de edificação" = Coletiva ou Agrupamento
  (etapa 5). Substitui a etapa homônima do fluxo individual
  (etapas/05-carga.html) — ver gdAplicarFluxoEdificacao() em
  js/app.js. O NOME da etapa é o mesmo nos dois fluxos: só o
  conteúdo muda, para que a numeração e o rótulo da sidebar não
  se alterem durante o preenchimento.

  Reúne num único card o que antes eram duas etapas ("Dados da
  torre" + "Dados das unidades"): o bloco da torre (endereço,
  quantidade de unidades e composição por pavimento) e, após um
  `divider`, a lista das UCs com o cálculo da demanda.
  Equivale a bt/etapas/13-ucs-coletivo.html +
  bt/etapas/14-cargas-coletivo.html, sem o card de troca do
  disjuntor geral (escopo de alteração de carga do BT).

  O MÉTODO de cálculo depende da quantidade de apartamentos
  residenciais:
    • 4 ou mais  → ND-5.2 (D = 1,4 × F × A), a partir da
      quantidade e da área média ponderada das UCs residenciais,
      somada à demanda não residencial informada pelo RT;
    • menos de 4 → cada UC detalha as próprias cargas (ND-5.1),
      como no fluxo individual.
  É a mesma regra do BT coletivo (modoCalculadoraF), agora
  compartilhada por shared/js/calc-nd52.js.

  Conteúdo montado por gdRenderTorre() / gdRenderUcs()
  (js/coletivo.js); o número da etapa é reescrito por
  gdRenumerarEtapas() conforme a posição real.
  ============================================================
-->
<div class="card">
  <div class="section-eyebrow" data-etapa="unidades">Etapa 6</div>
  <h3 class="card-title">Dados das unidades</h3>
  <!-- Conteúdo condicional: oculto por gdAplicarConteudoCarga() quando as
       cargas não se aplicam (Grupo A, solicitação que não mexe na potência ou
       edificação em branco). A ETAPA continua no fluxo — só o miolo some. -->
  <div data-carga-conteudo>
    <p class="card-sub">
      Informe a quantidade de unidades do agrupamento e os dados da área comum.
    </p>
    <div id="gdTorreEndereco"></div>
    <div id="gdTorreBox"></div>

    <!-- Segundo bloco da etapa: as UCs em si. Fica no MESMO card, separado só
         pelo divider — antes era a etapa 7 ("Dados das unidades"). -->
    <h4 class="card-subtitle divider">Unidades consumidoras</h4>
    <p class="card-sub">
      Preencha os dados de cada UC. Em Conexão Nova não há disjuntor atual (a
      instalação ainda não existe).
    </p>
    <div id="gdUcsBox"></div>

    <!-- Demanda das UCs não residenciais: só no método ND-5.2, e só quando há
         alguma UC não residencial. Alternado por gdAtualizarCargasColetivo(). -->
    <div
      class="grid grid-2"
      id="gdDemandaNaoResBox"
      style="display: none; margin-top: 14px"
    >
      <div class="field field--plain" data-noopt>
        <label>Demanda geral não residencial (kVA)</label>
        <input
          type="number"
          data-k="demandaNaoResidencial"
          placeholder="0,0"
          oninput="_sync('demandaNaoResidencial'); gdAtualizarCargasColetivo()"
        />
      </div>
    </div>

    <!-- Rodapé: KPIs (carga instalada / demanda) + disjuntor geral do
         agrupamento, montados por gdRenderDisjGeral(). -->
    <div id="gdDisjGeralBox"></div>
  </div>
</div>

<div class="nav-bottom no-print">
  <button class="btn btn-ghost" data-nav="prev">← Voltar</button>
  <button class="btn btn-primary" data-nav="next">Avançar →</button>
</div>
