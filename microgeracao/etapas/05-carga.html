
<div class="card">
  <div class="section-eyebrow">Etapa 6</div>
  <h3 class="card-title">Cargas das UCs</h3>
  <p class="card-sub">
    Para a unidade consumidora, detalhe as cargas para calcularmos a demanda e
    o disjuntor adequado.
  </p>
  <!-- Classe da UC: é ela que define o tipo de carga (Residencial → res;
       Comercial/Industrial → não-residencial) e, portanto, a lista de
       equipamentos. Equivale à "Atividade principal" do BT, que fica junto
       da identificação da UC. Sem ela a lista não tem como ser montada. -->
  <div class="grid grid-2">
    <div class="field">
      <label>Classe da unidade <span class="req">*</span></label>
      <select data-k="classe" onchange="onClasseGD()"></select>
    </div>
  </div>
  <div id="calcDemandaBox" style="margin-top: 14px"></div>
  <div id="resultadoCargaBox"></div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" onclick="goTo(4)">← Voltar</button>
  <button class="btn btn-primary" onclick="goTo(6)">Avançar →</button>
</div>
