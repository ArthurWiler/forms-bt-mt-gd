
<!--
  ============================================================
  ETAPA 6 (fluxo Individual) — Dados das unidades
  ------------------------------------------------------------
  Mesmo NOME da etapa do fluxo Coletivo/Agrupamento
  (etapas/06-dados-unidades.html): só o conteúdo muda conforme o
  "Tipo de edificação", para que a numeração e o rótulo da
  sidebar não se alterem durante o preenchimento. Aqui há uma
  única UC, que detalha as próprias cargas pela ND-5.1.
  ============================================================
-->
<div class="card">
  <div class="section-eyebrow" data-etapa="unidades">Etapa 6</div>
  <h3 class="card-title">Dados das unidades</h3>
  <!-- Conteúdo condicional: oculto por gdAplicarConteudoCarga() quando as
       cargas não se aplicam (Grupo A, solicitação que não mexe na potência ou
       edificação em branco). A ETAPA continua no fluxo — só o miolo some, e no
       lugar dele entra o [data-carga-aviso] abaixo. -->
  <div data-carga-conteudo>
    <p class="card-sub">
      Para a unidade consumidora, detalhe as cargas para calcularmos a demanda
      e o disjuntor adequado.
    </p>
    <!-- Atividade principal (state.classe): é ela que define o tipo de carga
         (Residencial → res; Comercial/Industrial → não-residencial) e,
         portanto, a lista de equipamentos. Mesmo nome do campo equivalente do
         BT e da minigeração. Sem ela a lista não tem como ser montada. -->
    <div class="grid grid-2">
      <div class="field">
        <label>Atividade principal <span class="req">*</span></label>
        <select data-k="classe" onchange="onClasseGD()"></select>
      </div>
    </div>
    <div id="calcDemandaBox" style="margin-top: var(--cmg-space-8)"></div>
    <div id="resultadoCargaBox"></div>
  </div>
  <!-- No lugar dos campos quando as cargas não se aplicam por um motivo
       DEFINITIVO (Grupo A ou solicitação que não mexe na potência) — ver
       gdCargaNaoSeAplica() em js/app.js. Com o tipo de edificação ainda em
       branco nem os campos nem o aviso aparecem: o card fica só com o
       cabeçalho. -->
  <div data-carga-aviso hidden>
    <div class="cmg-aviso no-print">
      <div class="cmg-aviso-icon" aria-hidden="true"></div>
      <p class="cmg-aviso-texto">
        Devido às características da sua solicitação, não é necessário detalhar
        as cargas. Por favor, avance para o próximo passo.
      </p>
    </div>
  </div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" data-nav="prev">← Voltar</button>
  <button class="btn btn-primary" data-nav="next">Avançar →</button>
</div>
