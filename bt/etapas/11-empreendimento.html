<!doctype html>

<div class="card">
  <div class="section-eyebrow">Etapa 4</div>
  <h3 class="card-title">Dados do empreendimento</h3>
  <p class="card-sub">Preencha os dados gerais do empreendimento.</p>

  <div class="grid grid-2">
    <div class="field col-span-2">
      <label>
        Cliente / Razão Social do empreendimento <span class="req">*</span>
      </label>
      <!-- Chave própria (prop.cliente): a razão social do empreendimento é
           independente do nome de contato (prop.nome) da Etapa 2 — antes as
           duas dividiam a mesma chave e o campo já nascia preenchido. -->
      <input
        type="text"
        data-k="prop.cliente"
        placeholder=" "
        oninput="onEmprGate()"
      />
    </div>
    <div class="field">
      <label>CPF / CNPJ <span class="req">*</span></label>
      <input
        type="text"
        data-k="prop.cpfCnpj"
        placeholder=" "
        oninput="
          onCpfCnpjBT(this);
          onEmprGate();
        "
      />
      <!-- Status/erro do documento como supporting-text ABAIXO do campo (mesma
           convenção .field-hint dos demais campos) — antes ficava numa flex ao
           lado do input, o que empurrava a mensagem para dentro da caixa. -->
      <span id="cnpjStatus" class="field-hint"></span>
    </div>
    <div class="field">
      <label>Nº ART/TRT de Projeto <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.art"
        placeholder=" "
        oninput="onEmprGate()"
      />
    </div>
    <!-- Endereço da obra no MESMO grid dos campos acima, para o espaçamento
         (gap) ficar uniforme entre todas as linhas da etapa. Por isso não pode
         haver um wrapper próprio em volta: a revelação (só depois de cliente +
         documento válido + ART) é feita campo a campo pela classe
         .empr-detalhe — ver onEmprGate em js/coletivo-app.js. -->
    <div class="field empr-detalhe">
      <label>CEP <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.cep"
        placeholder="00000-000"
        oninput="onCepBT(this, 'obra')"
      />
      <span id="cepStatusObra" class="field-hint"></span>
    </div>
    <div class="field col-span-2 empr-detalhe">
      <label>Endereço <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.endereco"
        placeholder=" "
        onblur="onEnderecoUrbanoBT()"
      />
    </div>
    <div class="field empr-detalhe">
      <label>Nº <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.num"
        placeholder=" "
        onblur="onEnderecoUrbanoBT()"
      />
    </div>
    <div class="field empr-detalhe">
      <label>Bairro <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.bairro"
        placeholder=" "
        onblur="onEnderecoUrbanoBT()"
      />
    </div>
    <div class="field empr-detalhe">
      <label>Cidade / Município <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.cidade"
        placeholder=" "
        onblur="onEnderecoUrbanoBT()"
      />
    </div>
    <div class="field empr-detalhe">
      <label>Estado <span class="req">*</span></label>
      <input type="text" data-k="obra.estado" placeholder=" " />
    </div>
  </div>

  <!-- As perguntas de distância/padrão pronto e os campos de rede BT e
       transformador vivem na etapa "Dados das unidades" (fluxo condomínio,
       etapas/15-unidades-torres.html): são características do atendimento de
       cada unidade, não do cadastro do empreendimento. -->

  <div id="emprDetalhes" style="display: none">
    <div class="mapa-obra divider">
      <p class="mapa-hint">
        Confirme a localização da unidade no mapa. Se o pin estiver incorreto,
        você pode clicar e arrastá-lo para ajustar.
      </p>
      <div class="mapa-actions">
        <span class="field-hint" id="mapaStatus"></span>
      </div>
      <div id="map" class="mapa-canvas"></div>
    </div>

    <div class="grid grid-3">
      <div class="field">
        <label>Latitude</label>
        <input
          type="text"
          data-k="obra.lat"
          placeholder=" "
          oninput="onCoordBT()"
        />
      </div>
      <div class="field">
        <label>Longitude</label>
        <input
          type="text"
          data-k="obra.lng"
          placeholder=" "
          oninput="onCoordBT()"
        />
      </div>
      <div class="field">
        <label>Coordenada UTM</label>
        <input type="text" id="bt_utm" readonly disabled placeholder=" " />
      </div>
    </div>

    <div
      class="field"
      id="restricaoAmbientalBox"
      style="margin-top: 14px; display: none"
    >
      <div id="restricaoAmbientalConteudo"></div>
    </div>
  </div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" data-nav="prev">← Voltar</button>
  <button class="btn btn-primary" data-nav="next" data-gate="btEmprOk">
    Avançar →
  </button>
</div>
