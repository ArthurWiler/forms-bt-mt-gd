<!doctype html>

<div class="card">
  <div class="section-eyebrow">Etapa 3</div>
  <h3 class="card-title">Dados da unidade consumidora</h3>
  <p class="card-sub">
    Preencha os dados de identificação das unidades consumidoras.
  </p>

  <div class="grid grid-2">
    <div class="field field--plain" data-noopt>
      <label>Zona de localização</label>
      <div data-toggle="obra.localizacao" data-toggle-onchange="onZonaBT"></div>
      <select
        data-k="obra.localizacao"
        style="display: none"
        aria-hidden="true"
      >
        <option>Urbana</option>
        <option>Rural</option>
      </select>
    </div>
  </div>

  <div class="grid grid-2" id="endUrbanoBox" style="margin-top: 14px">
    <div class="field">
      <label>CEP <span class="req">*</span></label>
      <div style="display: flex; gap: 8px; align-items: center">
        <div style="max-width: 180px">
          <input
            type="text"
            data-k="obra.cep"
            placeholder="00000-000"
            oninput="onCepBT(this, 'obra')"
          />
        </div>
        <span id="cepStatusObra"></span>
      </div>
    </div>
    <div class="field col-span-2">
      <label>Endereço <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.endereco"
        placeholder=" "
        onblur="onEnderecoUrbanoBT()"
      />
    </div>
    <div class="field">
      <label>Nº <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.num"
        placeholder=" "
        onblur="onEnderecoUrbanoBT()"
      />
    </div>
    <div class="field">
      <label>Bairro <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.bairro"
        placeholder=" "
        onblur="onEnderecoUrbanoBT()"
      />
    </div>
    <div class="field">
      <label>Cidade / Município <span class="req">*</span></label>
      <input
        type="text"
        data-k="obra.cidade"
        placeholder=" "
        onblur="onEnderecoUrbanoBT()"
      />
    </div>
    <div class="field">
      <label>Estado <span class="req">*</span></label>
      <input type="text" data-k="obra.estado" placeholder=" " />
    </div>
  </div>

  <div
    class="grid grid-2"
    id="endRuralBox"
    style="margin-top: 14px; display: none"
  >
    <div class="field">
      <label>Município <span class="req">*</span></label>
      <input type="text" data-k="obra.cidade" data-k-espelho placeholder=" " />
    </div>
    <div class="field">
      <label>Estado <span class="req">*</span></label>
      <input type="text" data-k="obra.estado" data-k-espelho placeholder=" " />
    </div>
    <div class="field">
      <label>Distrito / Comunidade / Região</label>
      <input type="text" data-k="obra.distritoComunidade" placeholder=" " />
    </div>
    <div class="field">
      <label>Nome da propriedade</label>
      <input type="text" data-k="obra.nomePropriedade" placeholder=" " />
    </div>
    <div class="field">
      <label>Ponto de referência</label>
      <input type="text" data-k="obra.pontoRef" placeholder=" " />
    </div>
    <div class="field">
      <label>Nº instalação / UC / medidor mais próxima</label>
      <input type="text" data-k="obra.instProxima" placeholder=" " />
    </div>
  </div>

  <div class="mapa-obra divider">
    <p class="mapa-hint">
      Confirme a localização da unidade no mapa. Se o pin estiver incorreto,
      você pode clicar e arrastá-lo para ajustar.
    </p>
    <div class="mapa-actions">
      <span class="field-hint" id="mapaStatus"></span>
    </div>
    <div id="map" class="mapa-canvas"></div>
  </div>

  <div class="grid grid-3">
    <div class="field">
      <label id="latLabel">Latitude</label>
      <input
        type="text"
        data-k="obra.lat"
        placeholder=" "
        oninput="onCoordBT()"
      />
    </div>
    <div class="field">
      <label id="lngLabel">Longitude</label>
      <input
        type="text"
        data-k="obra.lng"
        placeholder=" "
        oninput="onCoordBT()"
      />
    </div>
    <div class="field">
      <label>Coordenada UTM</label>
      <input type="text" id="bt_utm" readonly disabled placeholder=" " />
    </div>
  </div>

  <div
    class="field"
    id="restricaoAmbientalBox"
    style="margin-top: 14px; display: none"
  >
    <div id="restricaoAmbientalConteudo"></div>
  </div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" data-nav="prev">← Voltar</button>
  <button class="btn btn-primary" data-nav="next" data-gate="btDadosOk">
    Avançar →
  </button>
</div>
