<!doctype html>

<!-- Armazenamento de energia (seção 5 da planilha da norma): bloco no fim da
     Etapa 5 do individual (Cargas dos imóveis), do coletivo e do condomínio de
     torres (Dados das unidades). Uma resposta por solicitação. Incluído pelo
     etapas-loader via [data-include]; os campos abaixo do "Possui" só
     aparecem com Sim (onArmazBT, bt-core.js). -->
<div class="divider armaz-bloco">
  <h4 class="card-subtitle">Armazenamento de energia</h4>
  <div class="grid grid-2">
    <div class="field field--plain col-span-2" data-noopt>
      <label>Possui sistema de armazenamento de energia?</label>
      <div data-toggle="armaz.possui" data-toggle-onchange="onArmazBT"></div>
      <select data-k="armaz.possui" style="display: none" aria-hidden="true">
        <option>Sim</option>
        <option>Não</option>
      </select>
    </div>
    <div
      class="grid grid-2 col-span-2"
      id="armazDetalheBox"
      style="display: none"
    >
      <div class="field field--plain col-span-2" data-noopt>
        <label>
          Sistema com possibilidade de operação ilhada?
          <span class="req">*</span>
          <span class="cmg-hint cmg-hint--direita" tabindex="0" role="img"
            aria-label="Ajuda: operação ilhada. Capacidade do sistema de baterias de se desconectar da rede elétrica durante um apagão e manter os equipamentos essenciais funcionando de forma independente, sem interrupção de energia."
            data-hint="Capacidade do sistema de baterias de se desconectar da rede elétrica durante um apagão e manter os equipamentos essenciais funcionando de forma independente, sem interrupção de energia."
            ><img class="field-info" src="../imgs/info.svg" alt="" aria-hidden="true"
          /></span>
        </label>
        <div data-toggle="armaz.ilhada"></div>
        <select data-k="armaz.ilhada" style="display: none" aria-hidden="true">
          <option value=""></option>
          <option>Sim</option>
          <option>Não</option>
        </select>
      </div>
      <div class="field">
        <label>Máxima potência de carga (kW) <span class="req">*</span></label>
        <input
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          data-k="armaz.potCarga"
          placeholder=" "
        />
      </div>
      <div class="field">
        <label
          >Máxima potência de descarga (kW) <span class="req">*</span></label
        >
        <input
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          data-k="armaz.potDescarga"
          placeholder=" "
        />
      </div>
    </div>
  </div>
</div>
