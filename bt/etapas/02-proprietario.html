<!doctype html>

<div class="card">
  <div class="section-eyebrow">Etapa 2</div>
  <h3 class="card-title">Dados pessoais</h3>
  <p class="card-sub">
    Preencha os dados do titular da conta de energia ou do proprietário do
    imóvel.
  </p>
  <div class="grid grid-2">
    <div class="field">
      <label>Nome completo (sem abreviações) <span class="req">*</span></label>
      <input type="text" data-k="prop.nome" placeholder=" " />
    </div>
    <div class="field">
      <label>E-mail <span class="req">*</span></label>
      <input type="email" data-k="prop.email" placeholder=" " />
    </div>
    <div class="field">
      <label>Celular <span class="req">*</span></label>
      <input
        type="text"
        data-k="prop.celular"
        placeholder=" "
        oninput="onMascara(this, mascararCelular)"
      />
    </div>
    <div class="field">
      <label>Telefone Fixo</label>
      <input
        type="text"
        data-k="prop.fixo"
        placeholder=" "
        oninput="onMascara(this, mascararFixo)"
      />
    </div>
    <!-- Documento do titular: o checkbox "Pessoa estrangeira" e o campo que
         ele comanda são UMA célula do grid (`.doc-titular`) — é o que põe o
         documento sozinho na linha, com o checkbox colado nele, como na
         referência do Figma. Fossem dois itens do grid, entre eles entraria o
         `gap` de 32px. O checkbox não tem data-k: quem grava o estado e
         alterna CPF/CNPJ ↔ RNE/RNM é onEstrangeiroBT(). -->
    <div class="doc-titular row-solo">
      <label class="cmg-check">
        <input
          type="checkbox"
          id="propEstrangeiro"
          onchange="onEstrangeiroBT(this)"
        />
        Pessoa estrangeira
      </label>
      <div class="field" id="docCpfCnpjBox">
        <label>CPF / CNPJ <span class="req">*</span></label>
        <div style="display: flex; gap: 8px; align-items: center">
          <input
            type="text"
            data-k="prop.cpfCnpj"
            placeholder=" "
            oninput="onCpfCnpjBT(this)"
          />
          <span id="cnpjStatus"></span>
        </div>
      </div>
      <div class="field" id="docRneBox" style="display: none">
        <label>Nº do RNE/RNM <span class="req">*</span></label>
        <input type="text" data-k="prop.rne" placeholder=" " />
      </div>
    </div>
    <div class="field pf-campo" style="display: none">
      <label>Filiação (Mãe ou Pai) <span class="req">*</span></label>
      <input type="text" data-k="prop.filiacao" placeholder=" " />
    </div>
    <div class="field pf-campo" style="display: none">
      <label>RG / RANI apenas números</label>
      <input
        type="text"
        data-k="prop.rg"
        placeholder=" "
        oninput="onMascara(this, mascararRG)"
      />
    </div>
    <!-- Data de nascimento vale para os dois documentos de pessoa física (CPF
         e RNE/RNM), daí a classe própria em vez de .pf-campo. -->
    <div class="field row-solo nasc-campo" style="display: none">
      <label>Data de Nascimento <span class="req">*</span></label>
      <input type="date" data-k="prop.nasc" placeholder=" " />
      <img
        class="field-hint-icon field-cal-icon"
        src="../imgs/calendar.svg"
        alt=""
        aria-hidden="true"
      />
    </div>
    <div class="field field--plain pf-campo" style="display: none" data-noopt>
      <label>
        Possui equipamento essencial à vida?
        <span class="label-ex"
          >(ex.: gerador de oxigênio, respirador, bomba infusora)</span
        >
      </label>
      <div data-toggle="prop.laudoMedico"></div>
      <select
        data-k="prop.laudoMedico"
        style="display: none"
        aria-hidden="true"
      >
        <option>Sim</option>
        <option>Não</option>
      </select>
    </div>
    <div class="field field--plain pf-campo" style="display: none" data-noopt>
      <label>
        Possui NIS (Número de Identificação Social) para Tarifa Social?
      </label>
      <div data-toggle="prop.nis" data-toggle-onchange="onNisBT"></div>
      <select data-k="prop.nis" style="display: none" aria-hidden="true">
        <option>Sim</option>
        <option>Não</option>
      </select>
    </div>
    <div class="field col-span-2 pf-campo" id="numNisBox" style="display: none">
      <label>Número do NIS <span class="req">*</span></label>
      <input type="text" data-k="prop.numNis" placeholder=" " />
    </div>
  </div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" data-nav="prev">← Voltar</button>
  <button class="btn btn-primary" data-nav="next" data-gate="btPropDocOk">
    Avançar →
  </button>
</div>
