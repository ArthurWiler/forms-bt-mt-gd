<!doctype html>

<div class="card">
  <div class="section-eyebrow">Etapa 6</div>
  <h3 class="card-title">Observações <span class="opt">(opcional)</span></h3>
  <div class="field">
    <textarea
      data-k="obs"
      rows="6"
      maxlength="500"
      oninput="onObsBT(this)"
      placeholder="Inclua informações relevantes: justificativa de disjuntor, atendimento híbrido, geração já conectada, etc."
    ></textarea>
    <span class="field-hint obs-contador" id="obsContador"
      >0/500 caracteres</span
    >
  </div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" data-nav="prev">← Voltar</button>
  <button class="btn btn-primary" data-nav="next">Avançar →</button>
</div>
