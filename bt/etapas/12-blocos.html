<!doctype html>

<div class="card">
  <div class="section-eyebrow">Etapa 4</div>
  <h3 class="card-title">Dados das torres</h3>
  <p class="card-sub">
    Preencha os dados das torres do empreendimento. Para agilizar o
    preenchimento, use o botão “Replicar dados” para copiar os dados de uma
    torre para as demais.
  </p>

  <div class="grid grid-2" style="margin-bottom: 14px">
    <div class="field" data-noopt>
      <label>Quantidade de torres <span class="req">*</span></label>
      <input
        type="number"
        data-k="atend.nBlocos"
        oninput="onNBlocos(this)"
        placeholder=" "
      />
    </div>
    <!-- "Replicar dados para todas as torres" na 2ª coluna do grid: o campo
         mantém a largura padrão dos demais fields (1fr). O botão fica centrado
         na altura do campo (spec Figma: align-items center). Preenchido por
         renderBlocos() só quando há mais de uma torre. -->
    <div id="blocosReplicarAcao" class="field-acao-lateral"></div>
  </div>

  <div id="blocosBox"></div>
  <div id="blocosPag"></div>

  <div
    class="alert alert-info"
    id="aviso304Blocos"
    style="margin-top: 10px; display: none"
  >
    Demanda total acima de 304 kVA: o atendimento fica condicionado à
    apresentação do projeto elétrico com ART/TRT.
  </div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" data-nav="prev">← Voltar</button>
  <button class="btn btn-primary" data-nav="next" data-gate="btBlocosOk">Avançar →</button>
</div>
