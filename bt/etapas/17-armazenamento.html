<!doctype html>

<!-- Armazenamento de energia (seção 5 da planilha da norma): uma resposta por
     solicitação, comum ao individual, coletivo e condomínio. Os campos abaixo
     do "Possui" só aparecem com Sim (onArmazBT, bt-core.js). -->
<div class="card">
  <div class="section-eyebrow">Etapa 6</div>
  <h3 class="card-title">Armazenamento de energia</h3>
  <p class="card-sub">
    Informe os dados do sistema de armazenamento de energia, se houver.
  </p>
  <div class="grid grid-2">
    <div class="field field--plain col-span-2" data-noopt>
      <label>
        Possui sistema de armazenamento de energia?
        <span class="req">*</span>
      </label>
      <div data-toggle="armaz.possui" data-toggle-onchange="onArmazBT"></div>
      <select data-k="armaz.possui" style="display: none" aria-hidden="true">
        <option>Sim</option>
        <option>Não</option>
      </select>
    </div>
    <div
      class="grid grid-2 col-span-2"
      id="armazDetalheBox"
      style="display: none"
    >
      <div class="field field--plain col-span-2" data-noopt>
        <label>
          Sistema com possibilidade de operação ilhada?
          <span class="req">*</span>
        </label>
        <div data-toggle="armaz.ilhada"></div>
        <select data-k="armaz.ilhada" style="display: none" aria-hidden="true">
          <option value=""></option>
          <option>Sim</option>
          <option>Não</option>
        </select>
      </div>
      <div class="field">
        <label>Máxima potência de carga (kW) <span class="req">*</span></label>
        <input
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          data-k="armaz.potCarga"
          placeholder=" "
        />
      </div>
      <div class="field">
        <label
          >Máxima potência de descarga (kW) <span class="req">*</span></label
        >
        <input
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          data-k="armaz.potDescarga"
          placeholder=" "
        />
      </div>
    </div>
  </div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" data-nav="prev">← Voltar</button>
  <button class="btn btn-primary" data-nav="next">Avançar →</button>
</div>
