<!doctype html>
<div class="card">
  <div class="section-eyebrow">Etapa 5</div>
  <h3 class="card-title">Dados da Geração</h3>
  <div class="grid grid-2">
    <div class="field">
      <label>Quantidade de fontes de geração <span class="req">*</span></label>
      <select data-k="qtdFontes" data-sem-vazio onchange="onQtdFontes()">
        <option>1</option>
        <option>2</option>
      </select>
    </div>
    <!-- Regras 17/18: a resposta trava a demanda de geração em 0 e a
         modalidade em Autoconsumo Local — os dois campos logo abaixo. Por isso
         a pergunta vive aqui, e não na etapa 4 (Tipo de atendimento). -->
    <div class="field field--plain" data-noopt>
      <label>O empreendimento será "Grid Zero"?</label>
      <div id="cardsGridZero"></div>
      <select
        data-k="gridZero"
        onchange="onGridZero()"
        style="display: none"
        aria-hidden="true"
      >
        <option>Não</option>
        <option>Sim</option>
      </select>
    </div>
    <div class="field col-span-2">
      <label
        >Potência Ativa Instalada Total de Geração (kW)
        <span class="req">*</span></label
      >
      <input
        type="text"
        data-k="potAtivaInstalada"
        readonly
        disabled
        placeholder=" "
      />
    </div>
    <div class="field">
      <label
        >Demanda a ser contratada de geração (kW)<span class="req"
          >*</span
        ></label
      >
      <input
        type="text"
        data-k="demandaGeracao"
        placeholder=" "
        oninput="onNumDec(this)"
      />
      <span id="demandaGeracaoHint" class="field-hint"></span>
    </div>
    <div class="field" id="potGeracaoAtualBox" style="display: none">
      <label>Potência de Geração Atual (kW) <span class="req">*</span></label>
      <input
        type="text"
        data-k="potGeracaoAtual"
        placeholder=" "
        oninput="
          onNumDec(this);
          recalcFontes();
        "
      />
    </div>
    <div class="field col-span-2">
      <label>Modalidade de compensação <span class="req">*</span></label>
      <select data-k="modalidade" onchange="onModalidade()"></select>
      <span id="modalidadeHint" class="field-hint"></span>
    </div>
    <div class="field col-span-2" id="gridZeroBanner" style="display: none">
      <div class="gd-modo-banner">
        <strong>Modalidade definida automaticamente: Autoconsumo Local</strong>
        <span>
          Como o empreendimento é "Grid Zero" (sem injeção de excedentes na
          rede), a modalidade de compensação fica travada em Autoconsumo Local.
        </span>
      </div>
    </div>
    <div class="field">
      <label>Qtde. de Instalações a receber o crédito</label>
      <input
        type="text"
        data-k="qtdInstalacoesCredito"
        placeholder=" "
        oninput="onSoDigitos(this)"
      />
    </div>
    <div class="field field--plain col-span-2" data-noopt>
      <label>Anexou contrato de constituição? (consórcio/cooperativa)</label>
      <div id="cardsAnexouContrato"></div>
      <select data-k="anexouContrato" style="display: none" aria-hidden="true">
        <option>Não</option>
        <option>Sim</option>
      </select>
    </div>
    <div
      class="field field--plain"
      id="consorcioBox"
      style="display: none"
      data-noopt
    >
      <label>Documentação do consórcio verificada?</label>
      <div id="cardsConsorcioVerificado"></div>
      <select
        data-k="consorcioVerificado"
        onchange="atualizarGFC()"
        style="display: none"
        aria-hidden="true"
      >
        <option>Não</option>
        <option>Sim</option>
      </select>
    </div>
  </div>

  <div id="fontesBox"></div>
</div>
<div class="nav-bottom no-print">
  <button class="btn btn-ghost" onclick="goTo(3)">← Voltar</button>
  <button class="btn btn-primary" onclick="goTo(5)">Avançar →</button>
</div>
