<!doctype html>

<!-- Armazenamento de energia (seção 5 da planilha da norma) da Geração
     Distribuída: bloco no fim da etapa "Dados da geração" da Microgeração e da
     Minigeração, incluído pelo etapas-loader via [data-include]. A
     visibilidade em cascata e a produção mensal vivem em
     shared/js/armazenamento.js. O BT tem a sua versão, sem os campos de
     central despachável (bt/etapas/parcial-armazenamento.html). -->
<div class="divider armaz-bloco">
  <h4 class="card-subtitle">Armazenamento de energia</h4>
  <div class="grid grid-2">
    <div class="field field--plain col-span-2" data-noopt>
      <label>Possui sistema de armazenamento de energia?</label>
      <div data-toggle="armazPossui" data-toggle-onchange="onArmazGD"></div>
      <select data-k="armazPossui" style="display: none" aria-hidden="true">
        <option>Sim</option>
        <option>Não</option>
      </select>
    </div>
    <div
      class="grid grid-2 col-span-2"
      id="armazDetalheBox"
      style="display: none"
    >
      <div class="field field--plain col-span-2" data-noopt>
        <label>
          Sistema com possibilidade de operação ilhada?
          <span class="req">*</span>
          <span class="cmg-hint cmg-hint--direita" tabindex="0" role="img"
            aria-label="Ajuda: operação ilhada. Capacidade do sistema de baterias de se desconectar da rede elétrica durante um apagão e manter os equipamentos essenciais funcionando de forma independente, sem interrupção de energia."
            data-hint="Capacidade do sistema de baterias de se desconectar da rede elétrica durante um apagão e manter os equipamentos essenciais funcionando de forma independente, sem interrupção de energia."
            ><img class="field-info" src="../imgs/info.svg" alt="" aria-hidden="true"
          /></span>
        </label>
        <div data-toggle="armazIlhada"></div>
        <select data-k="armazIlhada" style="display: none" aria-hidden="true">
          <option value=""></option>
          <option>Sim</option>
          <option>Não</option>
        </select>
      </div>
      <div class="field">
        <label>Máxima potência de carga (kW) <span class="req">*</span></label>
        <input
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          data-k="armazPotCarga"
          placeholder=" "
        />
      </div>
      <div class="field">
        <label
          >Máxima potência de descarga (kW) <span class="req">*</span></label
        >
        <input
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          data-k="armazPotDescarga"
          placeholder=" "
        />
      </div>
      <div class="field field--plain col-span-2" data-noopt>
        <label>
          Possui central geradora despachável? (Art. 2º, IV-A, REN 1000/2021)
          <span class="req">*</span>
        </label>
        <div
          data-toggle="armazDespachavel"
          data-toggle-onchange="onArmazGD"
        ></div>
        <select
          data-k="armazDespachavel"
          style="display: none"
          aria-hidden="true"
        >
          <option value=""></option>
          <option>Sim</option>
          <option>Não</option>
        </select>
      </div>
      <div
        class="grid grid-2 col-span-2"
        id="armazDespachavelBox"
        style="display: none"
      >
        <div class="cmg-aviso cmg-aviso--warn col-span-2">
          <div class="cmg-aviso-icon" aria-hidden="true"></div>
          <div class="cmg-aviso-texto">
            Deverá ser anexado no APRWEB memória de cálculo que comprove 20% da
            capacidade de armazenar da produção mensal.
          </div>
        </div>
        <!-- KPI (spec kpi.svg, 13/11/2026): valor calculado, não é campo. -->
        <div class="resultado-card resultado-card--armaz col-span-2">
          <div class="resultado-card-label">
            Produção mensal da central geradora distribuída
          </div>
          <div class="resultado-card-valor" id="armazProducaoMensal">—</div>
        </div>
      </div>
    </div>
  </div>
</div>
