<!-- ============================================================
     Peças do PDF (shared/js/pdf-doc.js)
     ------------------------------------------------------------
     O documento exportado é montado a partir destes moldes: o JS
     clona e preenche com textContent, sem escrever markup em
     template string. É o que a regra "HTML primeiro, JS por
     exceção" (docs/css-architecture.md) pede — as classes seguem
     visíveis a uma busca textual, então a poda de CSS morto
     continua segura.

     A exceção justificada é apenas a MONTAGEM: quantas páginas,
     quantas seções e quantas linhas de tabela só se sabe em
     runtime, a partir do que foi preenchido.

     Ficam num fragmento compartilhado (e não na página de cada
     formulário) porque são os MESMOS componentes no BT, no
     Loteamento e no MT, estilizados pelo mesmo
     css/pdf/shared-pdf.css.
     shared/js/pdf-doc.js busca este arquivo uma única vez, na
     primeira exportação, e o injeta no <body>.
     ============================================================ -->

<template id="tplPdfDoc">
  <div class="pdf-doc" id="documentoPdf" aria-hidden="true"></div>
</template>

<template id="tplPdfPagina">
  <section class="pdf-pagina">
    <div class="pdf-corpo"></div>
    <div class="pdf-rodape"></div>
  </section>
</template>

<template id="tplPdfCabecalho">
  <header class="pdf-cabecalho">
    <img
      class="pdf-cabecalho-logo"
      src="../imgs/logos/logo-cemig-pdf.svg"
      alt="CEMIG"
      width="56"
      height="14"
    />
    <h1 class="pdf-titulo">Formulário de Ligação Nova e Alteração de Carga</h1>
    <div class="pdf-regua"></div>
  </header>
</template>

<template id="tplPdfSecao"><h2 class="pdf-secao-titulo"></h2></template>

<!-- Título de seção com um trecho em negrito ("Unidades com pedidos
     para <b>alteração de carga</b>", svg_4 do coletivo). A raiz
     mantém a classe .pdf-secao-titulo, então a poda de seções vazias
     e a repetição do título na folha de continuação valem também
     para ele. -->
<template id="tplPdfSecaoDestaque">
  <h2 class="pdf-secao-titulo">
    <span class="pdf-secao-texto"></span
    ><strong class="pdf-secao-forte"></strong>
  </h2>
</template>

<template id="tplPdfSubsecao"><h3 class="pdf-subsecao"></h3></template>

<!-- Subseção com chip de situação: "Transformador 2 ● Substituído"
     e "Cubículo 1 ● Já existente" (pdf-mt-alteracao/svg_2 e
     pdf-mt-alteracao-compartilhada/svg_2). Molde próprio porque o
     textContent do `subsecao` apagaria o chip. A raiz mantém a
     classe .pdf-subsecao, então a poda de subseções órfãs vale
     também para ela. -->
<template id="tplPdfSubsecaoChip">
  <h3 class="pdf-subsecao pdf-subsecao--chip">
    <span class="pdf-subsecao-texto"></span
    ><span class="pdf-chip"></span>
  </h3>
</template>

<!-- Fileira de setas entre os cartões do equipamento ATUAL e os do
     substituto (pdf-mt-alteracao/svg_2). Uma seta por coluna de
     cartão: o JS clona o <span> conforme a quantidade. -->
<template id="tplPdfSetas">
  <div class="pdf-setas" aria-hidden="true"><span class="pdf-seta">↓</span></div>
</template>

<!-- Cartão de mídia: a foto do modelo de subestação escolhido e a
     legenda ao lado (pdf-mt-nova/svg_2). Vêm sempre dentro de um
     .pdf-midias, que é uma linha de duas colunas — em alteração de
     carga o mock põe "Subestação atual" e "Nova subestação" lado a
     lado (pdf-mt-alteracao/svg_3). -->
<template id="tplPdfMidias"><div class="pdf-midias"></div></template>
<template id="tplPdfMidia">
  <div class="pdf-midia">
    <h3 class="pdf-subsecao pdf-midia-titulo"></h3>
    <div class="pdf-midia-cartao">
      <img class="pdf-midia-foto" alt="" />
      <div class="pdf-midia-legenda"></div>
    </div>
  </div>
</template>

<!-- Caixa do ramal de entrada: o desenho ocupa a faixa de cima e a
     legenda vem abaixo, uma linha por item, com o valor em negrito
     (pdf-mt-nova/svg_3). O ícone à direita é o mesmo info.svg dos
     avisos da tela. -->
<template id="tplPdfRamal">
  <div class="pdf-ramal">
    <img class="pdf-ramal-desenho" alt="" />
    <div class="pdf-ramal-legenda">
      <p class="pdf-ramal-linha">
        <span class="pdf-ramal-rotulo"></span
        ><strong class="pdf-ramal-valor"></strong>
      </p>
    </div>
    <img
      class="pdf-ramal-icone"
      src="../imgs/info.svg"
      alt=""
      width="16"
      height="16"
    />
  </div>
</template>
<template id="tplPdfFilete"><div class="pdf-filete"></div></template>

<template id="tplPdfGrade"><div class="pdf-grade"></div></template>
<template id="tplPdfCampo">
  <div class="pdf-campo">
    <div class="pdf-rotulo"></div>
    <div class="pdf-valor"></div>
  </div>
</template>

<template id="tplPdfCartoes"><div class="pdf-cartoes"></div></template>
<template id="tplPdfCartao">
  <div class="pdf-cartao">
    <div class="pdf-rotulo"></div>
    <div class="pdf-valor"></div>
  </div>
</template>

<template id="tplPdfTabela">
  <table class="pdf-tabela">
    <thead>
      <tr></tr>
    </thead>
    <tbody></tbody>
  </table>
</template>

<!-- Linha de fechamento DENTRO da tabela ("CARGA TOTAL: 25,36 kW"
     no mock do individual). O colspan é o único atributo que o JS
     preenche: só em runtime se sabe quantas colunas a tabela ficou
     tendo. -->
<template id="tplPdfTabelaTotal">
  <tr class="pdf-tabela-total">
    <td></td>
  </tr>
</template>

<!-- A outra forma de fechar uma tabela: uma LINHA comum em negrito,
     com as células nas colunas normais ("TOTAL | 11" da tabela de
     lotes do loteamento). -->
<template id="tplPdfTabelaTotalLinha">
  <tr class="pdf-tabela-total-linha"></tr>
</template>

<template id="tplPdfTotal">
  <div class="pdf-total">
    <span class="pdf-total-rotulo"></span>
    <span class="pdf-total-valor"></span>
  </div>
</template>

<template id="tplPdfObservacoes"><p class="pdf-observacoes"></p></template>

<template id="tplPdfAssinatura">
  <div class="pdf-assinatura">
    Local e data / Assinatura do proprietário ou representante legal
  </div>
</template>
